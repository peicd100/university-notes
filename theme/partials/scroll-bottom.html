<nav class="peicd-section-jump" data-peicd-section-jump aria-label="章節快速跳轉" hidden>
  <button type="button" data-peicd-section-direction="up" aria-label="上一個 H2" title="上一個二級標題" disabled>
    {% include ".icons/material/arrow-up.svg" %}
  </button>
  <button type="button" data-peicd-section-direction="down" aria-label="下一個 H2" title="下一個二級標題" disabled>
    {% include ".icons/material/arrow-down.svg" %}
  </button>
</nav>
<button
  type="button"
  class="peicd-scroll-bottom md-icon is-hidden"
  data-peicd-scroll-bottom
  aria-label="Back to bottom"
  hidden
>
  {% set icon = "material/arrow-down" %}
  {% include ".icons/" ~ icon ~ ".svg" %}
  <span class="peicd-scroll-bottom__label">Back to bottom</span>
</button>
